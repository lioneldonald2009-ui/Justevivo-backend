name: Validate JUSTEVIVO backend

on:
  push:
    branches: [main, "fix/**"]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check backend JavaScript syntax
        run: |
          node --check server.js
          node --check video-processing.js
          node --check ai-video-assembly.js
          node --check social-oauth.js
